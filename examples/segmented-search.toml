schema = "presage-search-config"
schema_version = 2
order = "segment_then_degree_then_format"
segments = [1, 4]
degrees = [5]
internal_formats = [{format = {kind = "fixed", width = 32, integer_bits = 6, signed = true, rounding = "nearest_even", overflow = "reject"}}]

[settings]
evaluation = "fma"
generation_precision = 256
proof_precision = 256
norm_accuracy = "1/1024"
max_refinements = 2

[limits]
max_attempts = 2
job_timeout_seconds = 60.0
total_timeout_seconds = 120.0
